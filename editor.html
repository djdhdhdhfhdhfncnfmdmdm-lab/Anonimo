<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor da Loja</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0d0f1a;color:#eef;padding-bottom:60px}.w{max-width:760px;margin:auto;padding:16px}h1{font-size:20px;margin-bottom:4px}#st{font-size:13px;color:#00e0a4;margin-bottom:10px;min-height:18px}nav{display:flex;gap:6px;position:sticky;top:0;background:#0d0f1a;padding:8px 0;z-index:2;overflow:auto}button,.b{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:10px 14px;background:#7c5cff;color:#fff;font-weight:700;display:inline-block;margin:6px 6px 6px 0}nav button{flex:1;min-width:90px;margin:0;background:#171a2b;padding:10px 4px;font-size:13px}nav .on{background:#7c5cff}.x{background:#c0334d}label{display:block;font-size:13px;color:#8a90b0;margin-top:10px}input,textarea,select{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid #fff3;background:#171a2b;color:#eef;font:inherit}textarea{min-height:70px}.box,.card,details,.r{background:#171a2b;border-radius:14px;padding:12px;margin:10px 0}.r{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:end}.mut{color:#aab}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:14px;border:1px solid #fff2;border-radius:14px;background:#111426}.metric b{display:block;font-size:20px;margin-top:4px}.sale{padding:12px;border-bottom:1px solid #fff2}.sale:last-child{border-bottom:0}.danger{background:#c0334d}.ok{color:#00e0a4}.warn{color:#ffc94d}.small{font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hide{display:none!important}.variant{border:1px solid #fff2;border-radius:10px;padding:10px;margin:8px 0}
</style></head><body><div class="w"><h1>🛠️ Editor da Loja</h1><div id="st">Verificando acesso…</div><nav id="nv"></nav><div id="m"></div></div>
<script>
const $=i=>document.getElementById(i), api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j});
let D={cats:[],prods:[],sales:[],tickets:[],saldo:0,soldTotal:0,withdrawnTotal:0,withdrawals:[]},tab=0;const tabs=['🏪 Loja','📂 Categorias','📦 Produtos','💰 Financeiro','🚀 Publicar'];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+(+n||0).toFixed(2).replace('.',',');
function status(t,cls=''){ $('st').textContent=t;$('st').className=cls }
async function load(){try{const me=await api('me');if(!me.admin)throw Error('Acesso permitido somente ao dono da loja');D=await api('admin/data');status('✓ Conectado como '+me.email,'ok');go(tab)}catch(x){status(x.message,'warn');$('m').innerHTML='<div class="box"><b>Não foi possível abrir o editor.</b><p class="mut" style="margin-top:8px">Entre com a conta Google definida em ADMIN_EMAIL e abra /editor pelo mesmo endereço da loja.</p></div>'}}
function go(t){tab=t;$('nv').innerHTML=tabs.map((n,i)=>`<button class="${i===t?'on':''}" onclick="go(${i})">${n}</button>`).join('');$('m').innerHTML=[tl,tc,tp,tf,tpub][t]();}
function tl(){return `<div class="box"><h3>Configurações</h3><label>Nome da loja<input id="sn" value="${e(localStorage.sn||'')}" placeholder="Loja Roblox"></label><button onclick="saveName()">Salvar nome</button><p class="mut small">A loja pública continua usando o mesmo visual e o logo.jpg do servidor.</p></div><div class="grid"><div class="metric"><span class="mut">Saldo disponível</span><b>${R(D.saldo)}</b></div><div class="metric"><span class="mut">Total vendido</span><b>${R(D.soldTotal)}</b></div><div class="metric"><span class="mut">Já resgatado</span><b>${R(D.withdrawnTotal)}</b></div><div class="metric"><span class="mut">Compras pagas</span><b>${D.sales.length}</b></div></div><div class="box"><h3>Últimas compras</h3>${D.sales.slice(0,10).map(s=>`<div class="sale"><div class="row"><b>${e(s.title||'Conta')}</b><b>${R(s.net||s.amount)}</b></div><div class="mut small">${e(s.email)} · ${new Date(s.paidAt||s.t).toLocaleString('pt-BR')}</div></div>`).join('')||'<p class="mut">Nenhuma compra paga ainda.</p>'}</div>`}
async function saveName(){try{const v=$('sn').value.trim();await api('admin/settings',{storeName:v});status('✓ Nome salvo','ok')}catch(x){status(x.message,'warn')}}
function tc(){return D.cats.map((c,i)=>`<div class="r"><img src="${e(c.img)}" style="width:90px;height:90px;object-fit:cover;border-radius:10px"><div><b>${e(c.name)}</b><div class="mut small">${e(c.tip||'')}</div></div><button class="x" onclick="del('cat','${c.id}')">✕</button></div>`).join('')+`<div class="box"><h3>Nova categoria</h3><label>Nome<input id="cn" placeholder="Blox Fruits"></label><label>Imagem (link)<input id="ci" placeholder="https://..."></label><label>Dica<input id="ct" placeholder="Contas disponíveis"></label><button onclick="addCat()">＋ Adicionar</button></div>`}
async function addCat(){try{await api('admin/cat',{name:$('cn').value,img:$('ci').value,tip:$('ct').value});D=await api('admin/data');go(1)}catch(x){alert(x.message)}}
function tp(){return D.prods.map(p=>`<details><summary>${e(p.title)}</summary><p class="mut small">${e(p.desc||'')}</p><p class="small">Categoria: ${e(D.cats.find(c=>c.id===p.cat)?.name||'')}</p>${(p.vars||[]).map(v=>`<div class="variant"><div class="row"><b>${e(v.name||'Conta')}</b><b>${R(v.price)}</b></div><div class="mut small">${v.sold?'Vendido':'Disponível'}</div></div>`).join('')}<button class="x" onclick="del('prod','${p.id}')">Excluir produto</button></details>`).join('')+`<div class="box"><h3>Novo produto</h3><label>Título<input id="pt" placeholder="Conta Blox Fruits"></label><label>Categoria<select id="pc">${D.cats.map(c=>`<option value="${c.id}">${e(c.name)}</option>`).join('')}</select></label><label>Descrição<textarea id="pd" placeholder="Descrição da conta"></textarea></label><label>Imagem (uma URL por linha)<textarea id="pi" placeholder="https://..."></textarea></label><h4 style="margin-top:12px">Conta / variante</h4><div id="vars"><div class="variant"><label>Nome<input class="vn" placeholder="Conta completa"></label><label>Preço<input class="vp" type="number" step="0.01" min="0.01" placeholder="20"></label><label>Login<input class="vl" placeholder="login Roblox"></label><label>Senha<input class="vs" placeholder="senha Roblox"></label></div></div><button onclick="addVar()">＋ Outra conta</button><button onclick="addProd()">＋ Cadastrar produto</button></div>`}
function addVar(){const d=document.createElement('div');d.className='variant';d.innerHTML='<label>Nome<input class="vn" placeholder="Conta completa"></label><label>Preço<input class="vp" type="number" step="0.01" min="0.01"></label><label>Login<input class="vl"></label><label>Senha<input class="vs"></label><button class="x" onclick="this.parentElement.remove()">Remover</button>';$('vars').appendChild(d)}
async function addProd(){try{const vars=[...document.querySelectorAll('.variant')].map(x=>({name:x.querySelector('.vn').value,price:+x.querySelector('.vp').value,login:x.querySelector('.vl').value,senha:x.querySelector('.vs').value}));await api('admin/prod',{title:$('pt').value,cat:$('pc').value,desc:$('pd').value,imgs:$('pi').value.split('\n').map(x=>x.trim()).filter(Boolean),vars});D=await api('admin/data');go(2)}catch(x){alert(x.message)}}
async function del(kind,id){if(!confirm('Excluir este item?'))return;try{await api('admin/del',{kind,id});D=await api('admin/data');go(tab)}catch(x){alert(x.message)}}
function tf(){return `<div class="grid"><div class="metric"><span class="mut">Saldo disponível</span><b>${R(D.saldo)}</b></div><div class="metric"><span class="mut">Já resgatado</span><b>${R(D.withdrawnTotal)}</b></div></div><div class="box"><h3>Sacar por Pix</h3><p class="mut small">O valor solicitado é limitado ao saldo disponível. Nunca coloque token do Mercado Pago aqui.</p><label>Valor<input id="wa" type="number" step="0.01" min="1" max="${D.saldo}" placeholder="10,00"></label><label>Tipo de chave<select id="wt"><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="email">E-mail</option><option value="phone">Telefone</option><option value="random">Chave aleatória</option></select></label><label>Chave Pix<input id="wk" placeholder="Sua chave Pix"></label><button onclick="withdraw()">💸 Sacar</button></div><div class="box"><h3>Histórico de saques</h3>${D.withdrawals.map(x=>`<div class="sale"><div class="row"><b>${R(x.amount)}</b><span class="small">${e(x.status||'created')}</span></div><div class="mut small">${new Date(x.t).toLocaleString('pt-BR')} · ${e(x.key)}</div></div>`).join('')||'<p class="mut">Nenhum saque registrado.</p>'}</div>`}
async function withdraw(){try{const r=await api('admin/withdraw',{amount:+$('wa').value,type:$('wt').value,key:$('wk').value.trim()});D=await api('admin/data');alert('Saque enviado. Status: '+r.status);go(3)}catch(x){alert(x.message)}}
function tpub(){return `<div class="box"><h3>Publicação</h3><p class="mut">Esta versão usa o servidor para catálogo, login, compras, saldo e saques. Não é mais necessário editar e baixar o loja.html pelo navegador.</p><p class="mut" style="margin-top:10px">No Render, publique <b>server.js</b>, <b>loja.html</b>, <b>editor.html</b>, <b>logo.jpg</b> e <b>package.json</b>. Configure as variáveis de ambiente indicadas no README/guia.</p><p class="mut" style="margin-top:10px">Para não perder compras quando o serviço reiniciar, use PostgreSQL e configure <b>DATABASE_URL</b>.</p></div>`}
load();
</script></body></html>
